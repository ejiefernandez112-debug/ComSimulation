<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Chunky button skin, drawn as a 9-patch (corners stay sharp when stretched). Made for the UI theme. -->
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9BE65A"/>
      <stop offset="1" stop-color="#3E9C27"/>
    </linearGradient>
  </defs>
  <rect x="1" y="4" width="62" height="59" rx="15" fill="#000" fill-opacity="0.28"/>
  <rect x="1" y="1" width="62" height="58" rx="15" fill="#17260E"/>
  <rect x="4" y="4" width="56" height="52" rx="12" fill="#2A6B18"/>
  <rect x="4" y="4" width="56" height="46" rx="12" fill="url(#face)"/>
  <rect x="9" y="7" width="46" height="11" rx="5.5" fill="#fff" fill-opacity="0.42"/>
</svg>
