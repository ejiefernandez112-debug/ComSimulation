    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFDF4"/>
      <stop offset="1" stop-color="#EAD6A8"/>
    </linearGradient>
  </defs>
  <rect x="1" y="3" width="62" height="60" rx="13" fill="#000" fill-opacity="0.22"/>
  <rect x="1" y="1" width="62" height="59" rx="13" fill="#5A3F22"/>
  <rect x="4" y="4" width="56" height="53" rx="10" fill="#C8A465"/>
  <rect x="4" y="4" width="56" height="49" rx="10" fill="url(#face)"/>
</svg>
