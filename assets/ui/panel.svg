<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <!-- Cream window skin (9-patch) for every pop-up window: soft caramel rim, brown outline, a thicker lip along the bottom. -->
  <defs>
    <linearGradient id="cream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF9EB"/>
      <stop offset="1" stop-color="#FBEACB"/>
    </linearGradient>
  </defs>
  <rect x="2" y="6" width="92" height="89" rx="26" fill="#7A4A1F" fill-opacity="0.25"/>
  <rect x="1" y="1" width="94" height="90" rx="26" fill="#8A5A2B"/>
  <rect x="4" y="4" width="88" height="84" rx="23" fill="#E8B672"/>
  <rect x="8" y="8" width="80" height="74" rx="19" fill="url(#cream)"/>
  <rect x="11" y="11" width="74" height="68" rx="16" fill="none" stroke="#fff" stroke-opacity="0.7" stroke-width="2"/>
</svg>
